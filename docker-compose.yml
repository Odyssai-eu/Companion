services:
  app:
    build: .
    image: companion:local
    container_name: companion-app
    restart: unless-stopped
    environment:
      PORT: 3000
      # Postgres connection. Defaults to companion/companion/companion which
      # matches the `db:` service defaults below. Override via env if your
      # postgres volume was initialised with different credentials (existing
      # installs predating the rebrand should set POSTGRES_USER/PASSWORD/DB
      # to keep their data accessible — postgres does not re-init users on
      # an existing PGDATA volume when the env vars change).
      DATABASE_URL: postgres://${POSTGRES_USER:-companion}:${POSTGRES_PASSWORD:-companion}@db:5432/${POSTGRES_DB:-companion}
      NODE_ENV: production
      # AUTH_JWT_SECRET: set your own here, or leave empty — the app
      # generates a random session secret on first boot and persists it
      # at /app/data/jwt-secret. Either way, sessions stay valid across
      # restarts as long as the volume is preserved.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      # Public sign-up is off by default — operators add accounts manually
      # (seed on first boot, or future admin UI). Set ALLOW_SIGNUP=1 if you
      # actually want self-serve sign-up for your install.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      # Karpathy memory compiler (the `memory` service below). It is the RAG
      # ingestion pipeline: compiles conversations into structured memory and
      # the app then ingests it into nemo. If unreachable, Companion still
      # runs — memory just stops auto-learning from conversations.
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://memory:8001}
      # LAN subnets to scan for Odysseus engines when the user clicks
      # "Discover". The container sits on the Docker bridge (172.x), so
      # it can't auto-detect the host's LAN — we inject it. Comma-
      # separated CIDRs. Set to your own LAN (commonly 192.168.1.0/24,
      # 192.168.0.0/24, or 10.0.0.0/24).
      ODYSSAI_SCAN_SUBNETS: ${ODYSSAI_SCAN_SUBNETS:-192.168.1.0/24}
      # Session-cookie `Secure` flag. Browsers refuse to send Secure
      # cookies back over plain HTTP, so the default LAN install
      # (http://<host>:3100) needs COOKIE_SECURE=0 — otherwise every
      # API call 401s after a successful login. Set to 1 explicitly
      # when Companion sits behind a TLS-terminating reverse proxy.
      # Unset: defaults to ON in production (current behaviour), OFF
      # otherwise.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # nemo-memory RAG service — user/team graphs + embeddings. Runs as a
      # NATIVE HOST process (MLX needs Metal; Docker on macOS has no GPU),
      # provisioned by the OdyssAI Configurator, NOT a compose service.
      NEMO_MEMORY_URL: ${NEMO_MEMORY_URL:-http://host.docker.internal:8765}
    ports:
      # By default we bind to 127.0.0.1 only — Companion is reachable
      # from the same host (browser, IDE, MCP clients), but NOT from
      # the LAN or the internet. To expose it on your LAN, set
      # HOST_BIND=0.0.0.0 (and configure your firewall + AUTH_JWT_SECRET
      # accordingly).
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent orchestrator SSH keypair. Without this, every rebuild
      # regenerates the key and every cluster node loses trust until the
      # user re-runs ssh-setup on each. Bind mount (not a named volume)
      # so the host can back it up, swap it, or read it for incident
      # response without docker incantations.
      - /var/lib/companion/orchestrator-ssh:/root/.companion
      # App data — auto-generated session secret, etc. Survives
      # container restarts so users don't get signed out on every
      # `docker compose up`.
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: companion-db
    restart: unless-stopped
    environment:
      # Default user/password/db for fresh installs. Existing installs whose
      # postgres volume was init'd under a different name (e.g. the legacy
      # `thecompai` rebrand predecessor) must set these env vars to match
      # what's actually inside PGDATA — postgres does NOT re-init credentials
      # on an existing volume.
      POSTGRES_USER: ${POSTGRES_USER:-companion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-companion}
      POSTGRES_DB: ${POSTGRES_DB:-companion}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-companion}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases:
          # Existing-install back-compat: the sibling `thecompai-memory`
          # service (Karpathy memory compiler, separate repo) still
          # connects to `thecompai-db` by hostname. The container was
          # renamed `thecompai-db` → `companion-db` during the open-source
          # rebrand, breaking memory's DNS lookup. Keep the legacy alias
          # until thecompai-memory is updated or retired so existing
          # deploys don't lose their wiki.
          - thecompai-db

  # ── Memory stack ──────────────────────────────────────────────────────────
  # Three tiers, two services + one host process:
  #   user/team  → nemo-memory, a NATIVE HOST process on :8765 (MLX embeddings
  #                need Metal — Docker on macOS has no GPU). Provisioned by the
  #                OdyssAI Configurator; deliberately NOT a compose service
  #                (a containerized one collides on :8765 and can't embed).
  #   company    → the `lightrag` service below (standard HKUDS LightRAG),
  #                ONE shared org-wide graph everyone reads.
  #   compiler   → the `memory` service (Karpathy): conversations → structured
  #                memory → ingested into nemo by the app after each compile.

  memory:
    build:
      # DMG installs vendor the source at ./memory-src; on dev/prod hosts
      # point MEMORY_BUILD_CONTEXT at a checkout of thecompai/memory.
      context: ${MEMORY_BUILD_CONTEXT:-./memory-src}
      dockerfile: Dockerfile
    image: thecompai-memory:local
    container_name: thecompai-memory
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-companion}:${POSTGRES_PASSWORD:-companion}@db:5432/${POSTGRES_DB:-companion}
      # LiteLLM model id. openai/<model> + OPENAI_API_BASE → the orchestrator
      # (any OpenAI-compatible endpoint works). anthropic/* needs the API key.
      COMPILER_MODEL: ${COMPILER_MODEL:-openai/default}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:8000/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMPILE_DEBOUNCE_SECONDS: ${COMPILE_DEBOUNCE_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No published port — the app reaches it via service DNS (memory:8001).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: companion-lightrag
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      # Entity extraction + query LLM → the orchestrator.
      LLM_BINDING: openai
      LLM_BINDING_HOST: ${COMPANY_RAG_LLM_HOST:-http://host.docker.internal:8000/v1}
      LLM_BINDING_API_KEY: ${COMPANY_RAG_LLM_KEY:-none}
      LLM_MODEL: ${COMPANY_RAG_LLM:-default}
      # Embeddings via the host nemo service (nemo-embed, dim 1024) so the
      # whole memory stack is self-contained — and consistent with graphs
      # built by nemo (an existing company graph stays readable).
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: ${COMPANY_RAG_EMBED_HOST:-http://host.docker.internal:8765/v1}
      EMBEDDING_BINDING_API_KEY: none
      EMBEDDING_MODEL: ${COMPANY_RAG_EMBED_MODEL:-nemo-embed}
      EMBEDDING_DIM: ${COMPANY_RAG_EMBED_DIM:-1024}
    ports:
      # Published on 8766 — matches global_settings.company_rag_url default
      # (http://host.docker.internal:8766).
      - "${COMPANY_RAG_BIND:-0.0.0.0}:${COMPANY_RAG_PORT:-8766}:9621"
    volumes:
      - lightrag_data:/app/data/rag_storage
      - lightrag_inputs:/app/data/inputs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  lightrag_data:
  lightrag_inputs:
  db_data:
  app_data:
