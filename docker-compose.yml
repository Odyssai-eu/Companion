services:
  app:
    build: .
    image: thecompai/app:local
    container_name: thecompai-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://thecompai:thecompai@db:5432/thecompai
      NODE_ENV: production
      DEV_LICENSE_BYPASS: "1"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-3u20k0CdiFcCWfkYzRn8fpCSCgDxpOBwCv8kh_FTBf6R93aRJ_8G-9QSRJa52vKn}
      # The memory service is deployed independently (see thecompai-memory
      # repo). Defaults assume it runs on the same host on port 8001.
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://host.docker.internal:8001}
      # Optional external coding runner. When unset, /api/code/preflight uses
      # the app container's local read-only preflight.
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-}
      CODE_RUNNER_TOKEN: ${CODE_RUNNER_TOKEN:-}
    ports:
      - "${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: thecompai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thecompai
      POSTGRES_PASSWORD: thecompai
      POSTGRES_DB: thecompai
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thecompai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
