services:
  app:
    build: .
    image: thecompai/app:local
    container_name: thecompai-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://thecompai:thecompai@db:5432/thecompai
      NODE_ENV: production
      # DEV_LICENSE_BYPASS=1 disables the license gate on /api/*. Set in
      # the default docker-compose so the open-source self-host works
      # out of the box. The license gate is only meaningful in a hosted
      # multi-tenant deploy.
      DEV_LICENSE_BYPASS: "${DEV_LICENSE_BYPASS:-1}"
      # AUTH_JWT_SECRET: replace the literal below with a real secret
      # before exposing Companion beyond localhost. Generate one with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-replace-me-with-a-real-secret-before-deploy}
      # The memory service is deployed independently (see thecompai-memory
      # repo). Defaults assume it runs on the same host on port 8001.
      # Companion runs fine without it — the memory wiki just won't
      # auto-compile.
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://host.docker.internal:8001}
      # LAN subnets to scan for Odysseus engines when the user clicks
      # "Discover". The container sits on the Docker bridge (172.x), so
      # it can't auto-detect the host's LAN — we inject it. Comma-
      # separated CIDRs. Set to your own LAN (commonly 192.168.1.0/24,
      # 192.168.0.0/24, or 10.0.0.0/24).
      ODYSSAI_SCAN_SUBNETS: ${ODYSSAI_SCAN_SUBNETS:-192.168.1.0/24}
    ports:
      - "${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent orchestrator SSH keypair. Without this, every rebuild
      # regenerates the key and every cluster node loses trust until the
      # user re-runs ssh-setup on each. Bind mount (not a named volume)
      # so the host can back it up, swap it, or read it for incident
      # response without docker incantations.
      - /var/lib/thecompai/orchestrator-ssh:/root/.thecompai
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: thecompai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: thecompai
      POSTGRES_PASSWORD: thecompai
      POSTGRES_DB: thecompai
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thecompai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
