services:
  app:
    build: .
    image: companion:local
    container_name: companion-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://companion:companion@db:5432/companion
      NODE_ENV: production
      # AUTH_JWT_SECRET: replace the literal below with a real secret
      # before exposing Companion beyond localhost. Generate one with:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-replace-me-with-a-real-secret-before-deploy}
      # Public sign-up is off by default — operators add accounts manually
      # (seed on first boot, or future admin UI). Set ALLOW_SIGNUP=1 if you
      # actually want self-serve sign-up for your install.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      # Optional Karpathy memory compiler service (separate repo). If left
      # unset / unreachable, Companion runs fine — the memory wiki just
      # doesn't auto-compile from conversation history.
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-}
      # LAN subnets to scan for Odysseus engines when the user clicks
      # "Discover". The container sits on the Docker bridge (172.x), so
      # it can't auto-detect the host's LAN — we inject it. Comma-
      # separated CIDRs. Set to your own LAN (commonly 192.168.1.0/24,
      # 192.168.0.0/24, or 10.0.0.0/24).
      ODYSSAI_SCAN_SUBNETS: ${ODYSSAI_SCAN_SUBNETS:-192.168.1.0/24}
    ports:
      - "${HOST_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistent orchestrator SSH keypair. Without this, every rebuild
      # regenerates the key and every cluster node loses trust until the
      # user re-runs ssh-setup on each. Bind mount (not a named volume)
      # so the host can back it up, swap it, or read it for incident
      # response without docker incantations.
      - /var/lib/companion/orchestrator-ssh:/root/.companion
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: companion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: companion
      POSTGRES_DB: companion
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
